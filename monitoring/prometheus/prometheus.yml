global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    service: "ml-model-serving"

scrape_configs:
  # FastAPI gateway — exposes /metrics via prometheus_client
  - job_name: "gateway"
    static_configs:
      - targets: ["gateway:8000"]
    metrics_path: "/metrics"
    scrape_interval: 10s

  # Prometheus self-monitoring
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]
